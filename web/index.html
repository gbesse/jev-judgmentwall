<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Jev Judgment Wall</title><link rel="stylesheet" href="/style.css"></head><body><main><p class="eyebrow">JEV / DECLARED CRITERIA</p><h1>Judgment Wall</h1><p>Watch each real request land. Nothing here is an animated placeholder.</p><textarea id="text" rows="9" placeholder="Paste text to judge…"></textarea><div class="actions"><select id="pack"><option>generic</option><option>landing-page</option><option>resume</option><option>pitch-narrative</option></select><button id="run">Run wall</button><button id="export" disabled>Export PNG</button></div><p id="status" aria-live="polite"></p><section id="wall"></section><canvas id="card" hidden></canvas></main><script type="module" src="/app.js"></script></body></html>
